name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: aether-hub-macos
          - name: Windows (x64)
            platform: windows-latest
            args: --bundles nsis,msi
            targets: x86_64-pc-windows-msvc
            artifact: aether-hub-windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Tauri app
        run: npm run tauri build -- ${{ matrix.args }}
        env:
          # Public cloud configuration. The publishable key is safe to embed;
          # repository secrets override these defaults when present. The admin
          # token is intentionally NOT provided to CI so published builds
          # cannot write to the cloud.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://tniqfffgpisajjprjgmi.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_e7J0bhqynbEsMOD4FR_nXg_Iup0q0lH' }}
          VITE_AETHER_ADMIN_TOKEN: ""
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify public bundle has no admin token
        shell: bash
        run: |
          if grep -RE 'adminToken:"[^"]+"' dist/assets >/dev/null 2>&1; then
            echo "::error::Admin token found in the public bundle"
            exit 1
          fi
          echo "Public bundle is clean (empty admin token)."

      - name: Upload macOS bundles
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig

  publish:
    name: Publish updater manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build latest.json
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          node scripts/make-latest-json.mjs \
            --root artifacts \
            --version "$VERSION" \
            --base-url "https://github.com/killaurabeats/aether-hub-releases/releases/download/${TAG}" \
            --notes "Aether Hub ${TAG}: native auto-update, FREE/PRO plugins, Beta Tester invites." \
            --out latest.json

      - name: Upload updater manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-manifest
          path: latest.json

      - name: Publish signed release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: bash
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::RELEASES_TOKEN is not set; latest.json was uploaded as an artifact only."
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          REPO="killaurabeats/aether-hub-releases"
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "Aether Hub $TAG" \
              --notes "Aether Hub $TAG" --latest
          fi
          find artifacts -type f \( \
            -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
            -o -name '*-setup.exe' -o -name '*-setup.exe.sig' \
            -o -name '*.msi' -o -name '*.msi.sig' \
          \) -print0 | xargs -0 gh release upload "$TAG" --repo "$REPO" --clobber
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
